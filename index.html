<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>GTS Tour Expense Management & Claim Tracker</title>
    <meta name="description" content="GTS Facility Management Services Pvt Ltd - Tour Expense Management, Claim Submission, Approvals, Audit & Accounts" />
    
    <!-- PWA & Mobile Web App Meta -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#3C2A9A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GTS Tracker" />
    
    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
      /* Instant zero-latency splash screen styles */
      #splash-container {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(145deg, #3C2A9A 0%, #2f1f80 50%, #1f1358 100%);
        color: #ffffff;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 24px;
        user-select: none;
        -webkit-user-select: none;
      }
      .splash-logo-card {
        width: 180px;
        height: 90px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
        margin-bottom: 24px;
        animation: splashPop 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .splash-logo-img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
      .splash-badge {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #fbbf24;
        margin-bottom: 6px;
        opacity: 0.95;
      }
      .splash-title {
        font-size: 18px;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #ffffff;
        margin: 0 0 4px 0;
      }
      .splash-subtitle {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.7);
        margin: 0;
      }
      .splash-progress-track {
        margin-top: 32px;
        width: 160px;
        height: 4px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
      }
      .splash-progress-bar {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 50%;
        background: linear-gradient(90deg, #f59e0b, #fbbf24);
        border-radius: 999px;
        animation: splashShimmer 1.4s ease-in-out infinite;
      }
      .splash-footer {
        margin-top: 14px;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.6);
        font-weight: 500;
      }
      @keyframes splashPop {
        0% { transform: scale(0.92); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }
      @keyframes splashShimmer {
        0% { left: -50%; width: 30%; }
        50% { width: 60%; }
        100% { left: 110%; width: 40%; }
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased selection:bg-purple-100 selection:text-purple-900 min-h-screen">
    <div id="root">
      <!-- Instant Native-Grade Splash Screen displayed on app launch -->
      <div id="splash-container">
        <div class="splash-logo-card">
          <img src="/logo-transparent.png" alt="GTS Logo" class="splash-logo-img" />
        </div>
        <div class="splash-badge">GTS FACILITY MANAGEMENT SERVICES</div>
        <h1 class="splash-title">Tour Expense Management</h1>
        <p class="splash-subtitle">& Claim Tracker</p>
        <div class="splash-progress-track">
          <div class="splash-progress-bar"></div>
        </div>
        <div class="splash-footer">Initializing secure session...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
